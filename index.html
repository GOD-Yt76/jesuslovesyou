<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connect With Jesus</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.55)
                ),
                url("background.jpg") center/cover no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .container {
            width: 92%;
            max-width: 650px;
            padding: 45px 25px;
        }

        .cross {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(42px, 9vw, 75px);
            letter-spacing: 4px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: clamp(18px, 4vw, 26px);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .verse {
            font-size: 18px;
            line-height: 1.6;
            font-style: italic;
            margin: 25px auto;
            max-width: 520px;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 16px 38px;
            border-radius: 50px;
            background: white;
            color: #222;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="cross"></div>

        <h1>CONNECT<br>WITH JESUS</h1>

        <p class="subtitle">
            You are welcome here.
        </p>

        <p class="verse">
            “Come to me, all you who are weary and burdened,
            and I will give you rest.”
        </p>

        <p class="verse">
            — Matthew 11:28
        </p>

        <a class="button" href="#">
            ENTER
        </a>

        <div class="footer">
            A place to discover faith, hope and love.
        </div>

    </main>

</body>
</html>
